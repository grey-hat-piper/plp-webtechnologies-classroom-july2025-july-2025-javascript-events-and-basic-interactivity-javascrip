<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Pages with JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <button id="navbutton">=MENU=</button>
        <ul id="navlists">
            <li>HOME</li>
            <li>ABOUT</li>
            <li>CONTACT</li>
        </ul>
    </nav>

    <button type="button" id="modeswitch">DARK-MODE</button>

    <form id="signup" action="" method="post">
        <label for="username">USERNAME</label>
        <input type="text" name="username" id="username" placeholder="Enter Name">
        <label for="email">EMAIL</label>
        <input type="email" name="email" id="email" required placeholder="Enter e-mail">
        <label for="password">PASSWORD</label>
        <input type="password" name="password" id="password" required placeholder="Enter Password"><br>
        <button type="submit">SUBMIT</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
